name: Deploy LangSmith

# Deploys the agent to LangSmith Deployments (managed Agent Server) with
# `langgraph deploy`. Config: GitHub Environment "langsmith".

on:
  push:
    paths:
      - agent/**
      - .github/workflows/deploy-langsmith.yml
  workflow_dispatch:

concurrency:
  group: deploy-langsmith-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-langsmith:
    name: LangSmith agent deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: langsmith
    defaults:
      run:
        working-directory: agent
    env:
      LANGGRAPH_CLI_VERSION: "0.4.37"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_DEPLOYMENT_NAME: ${{ vars.LANGSMITH_DEPLOYMENT_NAME || 'mila-agent' }}
      LANGSMITH_DEPLOYMENT_TYPE: ${{ vars.LANGSMITH_DEPLOYMENT_TYPE || 'serverless' }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Write deployment env
        # Every non-reserved key becomes a deployment secret; LANGSMITH_* tracing
        # vars are reserved and injected by the platform.
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'us-central1' }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'mila_docs' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'BAAI/bge-small-en-v1.5' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || 'low' }}
          AGENT_TZ: ${{ vars.AGENT_TZ }}
          ENV: ${{ vars.ENV }}
          HOSTING: ${{ vars.HOSTING }}
        run: |
          set -euo pipefail
          for v in LANGSMITH_API_KEY GOOGLE_API_KEY ENV HOSTING; do
            if [ -z "${!v:-}" ]; then echo "::error::${v} is not set in the langsmith environment"; exit 1; fi
          done
          LABEL="${ENV}-${HOSTING}"
          umask 077
          {
            echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}"
            echo "GEMINI_MODEL=${GEMINI_MODEL}"
            echo "GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL}"
            echo "EMBEDDING_MODEL=${EMBEDDING_MODEL}"
            echo "ENVIRONMENT=${LABEL}"
            echo "APP_ENV=${LABEL}"
            if [ -n "${GOOGLE_CLOUD_PROJECT}" ]; then echo "GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}"; fi
            if [ -n "${GOOGLE_CLOUD_LOCATION}" ]; then echo "GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}"; fi
            if [ -n "${QDRANT_URL}" ]; then echo "QDRANT_URL=${QDRANT_URL}"; fi
            if [ -n "${QDRANT_COLLECTION}" ]; then echo "QDRANT_COLLECTION=${QDRANT_COLLECTION}"; fi
            if [ -n "${AGENT_TZ}" ]; then echo "AGENT_TZ=${AGENT_TZ}"; fi
          } > config/.env.langsmith

      - name: langgraph deploy
        run: |
          set -euo pipefail
          uvx --from "langgraph-cli==${LANGGRAPH_CLI_VERSION}" langgraph deploy \
            -c langgraph.langsmith.json \
            --name "${LANGSMITH_DEPLOYMENT_NAME}" \
            --deployment-type "${LANGSMITH_DEPLOYMENT_TYPE}" \
            --remote

      - name: Summary
        run: |
          set -euo pipefail
          echo "### LangSmith" >> "$GITHUB_STEP_SUMMARY"
          uvx --from "langgraph-cli==${LANGGRAPH_CLI_VERSION}" langgraph deploy list \
            --name-contains "${LANGSMITH_DEPLOYMENT_NAME}" >> "$GITHUB_STEP_SUMMARY"
