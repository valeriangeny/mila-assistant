services:
  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - '2024:8080'
    environment:
      PORT: '8080'
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mila_docs
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-Mila Agent - compose}
    depends_on:
      qdrant:
        condition: service_healthy

  copilot:
    build:
      context: .
      dockerfile: copilot/Dockerfile
    ports:
      - '3001:8080'
    environment:
      PORT: '8080'
      LANGGRAPH_URL: http://agent:8080
      LANGGRAPH_GRAPH_ID: mila_agent
    depends_on:
      - agent

  ingest:
    profiles: ['ingest']
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /work/ingest
    volumes:
      - ./:/work
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mila_docs
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    depends_on:
      qdrant:
        condition: service_healthy
    command: ['uv', 'run', 'mila-ingest', '--recreate']

volumes:
  qdrant_data:
