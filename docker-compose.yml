services:
  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Required by langchain/langgraph-api (licensed image). Local DB falls back to sqlite.
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - '2024:8080'
    environment:
      PORT: '8080'
      REDIS_URI: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mila_docs
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-Mila Agent - compose}
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  copilot:
    build:
      context: .
      dockerfile: copilot/Dockerfile
    ports:
      - '4000:8080'
    environment:
      PORT: '8080'
      LANGGRAPH_URL: http://agent:8080
      LANGGRAPH_GRAPH_ID: mila_agent
    depends_on:
      - agent

  ingest:
    profiles: ['ingest']
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /work/ingest
    volumes:
      - ./:/work
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: mila_docs
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      # Set MILA_SKIP_PII=1 to skip Presidio (faster smoke ingest).
      MILA_SKIP_PII: ${MILA_SKIP_PII:-}
    depends_on:
      qdrant:
        condition: service_healthy
    command: ['uv', 'run', 'mila-ingest', '--recreate']

  # Local mock IdP (OIDC). See mock-oauth2/README.md
  mock-oauth2-server:
    profiles: ['auth']
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - '8090:8080'
    volumes:
      - ./mock-oauth2/config.json:/app/config.json:ro
      - ./mock-oauth2/login.html:/app/login/login.html:ro
    environment:
      SERVER_PORT: '8080'
      JSON_CONFIG_PATH: /app/config.json
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/isalive']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  qdrant_data:
