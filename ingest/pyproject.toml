[project]
name = "mila-ingest"
version = "0.1.0"
description = "Ingest aliM corpus into Qdrant with ACL/PII metadata"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Valerian Geny" }]
dependencies = [
  "fastembed>=0.5.0",
  "python-dotenv>=1.0.0",
  "qdrant-client>=1.12.0",
]

[project.scripts]
mila-ingest = "mila_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mila_ingest"]

[tool.hatch.build.targets.wheel.sources]
"src/mila_ingest" = "mila_ingest"
