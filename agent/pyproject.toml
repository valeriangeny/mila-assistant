[project]
name = "mila-agent"
version = "0.1.0"
description = "LangGraph + Gemini knowledge assistant for aliM AI Institute"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Valerian Geny" }]
dependencies = [
  "langchain-core>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langgraph>=0.3.0",
  "langsmith>=0.3.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "langgraph-cli[inmem]>=0.2.0",
]

[project.scripts]
mila-agent = "mila_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mila_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/mila_agent" = "mila_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "evals"]
markers = [
  "langsmith: needs LangSmith + Gemini; pushes experiment results",
]
